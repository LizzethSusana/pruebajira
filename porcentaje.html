<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Porcentaje</title>
</head>
<body>
  <h1>Calculadora de Porcentaje</h1>
  <label for="cantidad">Cantidad:</label>
  <input type="number" id="cantidad" step="any"><br><br>
  <label for="porcentaje">Porcentaje (%):</label>
  <input type="number" id="porcentaje" step="any"><br><br>
  <button onclick="calcularPorcentaje()">Calcular</button>
  <p id="resultado"></p>
  <script src="porcentaje.js"></script>
</body>
</html>
